name: studymate_ai
description: "StudyMate AI — An AI-powered Learning Operating System for students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Local Database ───────────────────────────────────────────────────────────
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0

  # ── Secure Storage ───────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # ── Firebase ─────────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  google_sign_in: ^6.2.1

  # ── Networking ───────────────────────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  http: ^1.2.0

  # ── AI & ML ──────────────────────────────────────────────────────────────────
  google_generative_ai: ^0.4.6

  # ── Document Parsing ─────────────────────────────────────────────────────────
  syncfusion_flutter_pdf: ^26.2.14
  file_picker: ^8.1.2

  # ── OCR ──────────────────────────────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.13.1

  # ── UI & Design ──────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.3
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  badges: ^3.1.2

  # ── Notifications ────────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.3

  # ── Media & Files ────────────────────────────────────────────────────────────
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^10.0.0

  # ── Background Work ──────────────────────────────────────────────────────────
  workmanager: ^0.5.2

  # ── Utilities ────────────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^2.4.0
  collection: ^1.18.0
  rxdart: ^0.27.7
  dartz: ^0.10.1
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
